name: tasks
description: 本地优先的任务、专注与打卡工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态与路由
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # 数据层（ADR-0007：锁定 2.31，避开 sqlite3 3.x 的 GitHub 下载）
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.6

  # 通知与时区（M2）
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # 备忘录：Markdown 预览与附件
  flutter_markdown_plus: ^1.0.12
  image_picker: ^1.2.4
  path: ^1.9.1
  file_picker: ^13.4.0

  # 基础设施
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  rrule: ^0.2.18
  uuid: ^4.6.0
  logging: ^1.3.0
  archive: ^4.7.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
